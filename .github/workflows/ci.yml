name: RhemaScript CI

on:
  push:
    branches: ["main", "ci/**", "feat/**"] # Trigger current-base PR70 nested archive validation
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rhemascript-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Full contract and synthetic integration CI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Verify committed lock and install locked dependencies
        run: |
          sha256sum --check requirements-ci.lock.sha256
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --require-hashes -r requirements-ci.lock
          .venv/bin/python -m pip install --disable-pip-version-check --no-deps --no-build-isolation -e .
          .venv/bin/python -m pip check

      - name: Run full local CI suite
        run: .venv/bin/python ci/validate_if18_read_only.py --report-file if18-validation-report.json

      - name: Upload redacted IF-18 validation report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: if18-read-only-validation-report
          path: if18-validation-report.json
          if-no-files-found: warn
          retention-days: 14
