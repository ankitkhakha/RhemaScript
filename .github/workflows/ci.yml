name: RhemaScript CI

on:
  push:
    branches: ["main", "ci/**", "feat/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rhemascript-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Full contract and synthetic integration CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run full local CI suite
        run: python ci/validate_if18_read_only.py --report-file if18-validation-report.json

      - name: Upload redacted IF-18 validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: if18-read-only-validation-report
          path: if18-validation-report.json
          if-no-files-found: warn
          retention-days: 14
